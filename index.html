<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>معين — الاختبارات</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;

      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --border: #e5e7eb;
      --soft: #eef4ff;

      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-inner {
      max-width: 1150px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .role-badge {
      padding: 7px 12px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-weight: 700;
    }

    .container {
      width: min(1150px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: min(500px, 100%);
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .06);
    }

    .login-title {
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 10px;
    }

    .login-subtitle {
      color: var(--muted);
      margin-bottom: 28px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .04);
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 30px;
      font-weight: 800;
      margin: 0 0 7px;
    }

    .page-subtitle {
      color: var(--muted);
      margin: 0 0 25px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      background: white;
      color: var(--text);
      transition: .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      transition: .2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-secondary {
      background: #eef2f7;
      color: #374151;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .alert {
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .alert-success {
      background: #ecfdf5;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-info {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .stat-label {
      color: var(--muted);
    }

    .question-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      background: #fafafa;
    }

    .question-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .question-number {
      font-size: 18px;
      font-weight: 800;
    }

    .options {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .option-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .option-row input[type="radio"] {
      width: auto;
    }

    .exam-list {
      display: grid;
      gap: 15px;
    }

    .exam-item {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .exam-item-title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .exam-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 15px;
    }

    .meta-badge {
      background: #f1f5f9;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .student-question {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .student-question-title {
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .answer-choice {
      display: block;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 9px;
      cursor: pointer;
      transition: .2s;
    }

    .answer-choice:hover {
      background: #f8fafc;
    }

    .answer-choice input {
      width: auto;
      margin-left: 8px;
    }

    .result-box {
      text-align: center;
      padding: 30px;
      border-radius: 18px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      margin-bottom: 20px;
    }

    .result-score {
      font-size: 52px;
      font-weight: 900;
      color: var(--primary);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 4px solid #e5e7eb;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--muted);
    }

    code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 6px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .topbar-inner {
        align-items: flex-start;
      }

      .user-area {
        flex-direction: column;
        align-items: flex-end;
      }

      .card {
        padding: 18px;
      }

      .login-card {
        padding: 25px 20px;
      }

      .page-title {
        font-size: 26px;
      }

      .button-row {
        flex-direction: column;
      }

      .button-row .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginPage" class="login-page">
    <div class="login-card">

      <h1 class="login-title">تسجيل الدخول</h1>

      <p class="login-subtitle">
        منصة معين التعليمية
      </p>

      <div id="loginMessage"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginEmail">
            البريد الإلكتروني
          </label>

          <input
            id="loginEmail"
            type="email"
            placeholder="name@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">
            كلمة المرور
          </label>

          <input
            id="loginPassword"
            type="password"
            required
            autocomplete="current-password"
          >
        </div>

        <button
          id="loginButton"
          class="btn btn-primary"
          type="submit"
          style="width:100%;"
        >
          دخول
        </button>

      </form>
    </div>
  </section>


  <!-- APP -->
  <div id="app" class="hidden">

    <header class="topbar">

      <div class="topbar-inner">

        <div class="brand">
          معين
        </div>

        <div class="user-area">

          <span id="userEmail"></span>

          <span id="userRole" class="role-badge"></span>

          <button
            id="logoutButton"
            class="btn btn-secondary"
            type="button"
          >
            تسجيل الخروج
          </button>

        </div>

      </div>

    </header>


    <main class="container">

      <div id="globalMessage"></div>


      <!-- TEACHER -->
      <section id="teacherDashboard" class="hidden">

        <h1 class="page-title">
          لوحة المعلم
        </h1>

        <p class="page-subtitle">
          أنشئ الاختبارات وحدد الفصل والأسئلة ثم اعرضها للطلاب.
        </p>


        <div class="stats">

          <div class="stat">
            <div id="teacherExamCount" class="stat-number">
              0
            </div>

            <div class="stat-label">
              الاختبارات
            </div>
          </div>


          <div class="stat">
            <div id="teacherClassCount" class="stat-number">
              0
            </div>

            <div class="stat-label">
              الفصول
            </div>
          </div>


          <div class="stat">
            <div class="stat-number">
              معلم
            </div>

            <div class="stat-label">
              نوع الحساب
            </div>
          </div>

        </div>


        <!-- CREATE EXAM -->
        <div class="card">

          <h2>
            إنشاء اختبار جديد
          </h2>

          <p class="page-subtitle">
            سيتم حفظ الأسئلة والإجابات داخل
            <code>exam_answer_keys.answer_key</code>.
          </p>


          <div class="form-group">

            <label for="examTitle">
              عنوان الاختبار
            </label>

            <input
              id="examTitle"
              type="text"
              placeholder="مثال: اختبار الرياضيات الأول"
            >

          </div>


          <div class="form-group">

            <label for="examClass">
              الفصل
            </label>

            <select id="examClass">

              <option value="">
                اختر الفصل
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="examDuration">
              مدة الاختبار بالدقائق
            </label>

            <input
              id="examDuration"
              type="number"
              min="1"
              value="30"
            >

          </div>


          <div class="form-group">

            <label for="examStart">
              وقت بداية الاختبار — اختياري
            </label>

            <input
              id="examStart"
              type="datetime-local"
            >

          </div>


          <div class="form-group">

            <label for="examEnd">
              وقت نهاية الاختبار — اختياري
            </label>

            <input
              id="examEnd"
              type="datetime-local"
            >

          </div>


          <h3>
            الأسئلة
          </h3>

          <div id="questionsContainer"></div>


          <div class="button-row">

            <button
              id="addQuestionButton"
              class="btn btn-secondary"
              type="button"
            >
              + إضافة سؤال
            </button>

            <button
              id="createExamButton"
              class="btn btn-primary"
              type="button"
            >
              حفظ ونشر الاختبار
            </button>

          </div>

        </div>


        <!-- TEACHER EXAMS -->
        <div class="card">

          <h2>
            اختباراتي
          </h2>

          <div
            id="teacherExams"
            class="exam-list"
          ></div>

        </div>

      </section>


      <!-- STUDENT DASHBOARD -->
      <section id="studentDashboard" class="hidden">

        <h1 class="page-title">
          اختبارات الطالب
        </h1>

        <p class="page-subtitle">
          الاختبارات المتاحة حاليًا.
        </p>

        <div class="card">

          <div
            id="studentExams"
            class="exam-list"
          ></div>

        </div>

      </section>


      <!-- STUDENT EXAM -->
      <section id="studentExamPage" class="hidden">

        <button
          id="backToStudentExams"
          class="btn btn-secondary"
          type="button"
          style="margin-bottom:15px;"
        >
          ← العودة للاختبارات
        </button>


        <div class="card">

          <h1
            id="studentExamTitle"
            class="page-title"
          ></h1>

          <p
            id="studentExamMeta"
            class="page-subtitle"
          ></p>

        </div>


        <form id="studentExamForm"></form>


        <div class="card">

          <button
            id="submitStudentExam"
            class="btn btn-primary"
            type="button"
            style="width:100%;"
          >
            تسليم الاختبار
          </button>

        </div>


        <div
          id="studentResult"
          class="hidden"
        ></div>

      </section>

    </main>
  </div>


  <script>
    "use strict";

    /* =====================================================
       SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://jismzhdkzitlzjdmaltw.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_VXgWWjizZL-_7kchLqP9Mw_lfd-BTk3";


    if (!window.supabase) {
      document.body.innerHTML = `
        <div style="
          min-height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:20px;
          font-family:system-ui;
          direction:rtl;
          background:#f4f6fa;
        ">
          <div style="
            max-width:600px;
            background:white;
            padding:30px;
            border-radius:20px;
            border:1px solid #e5e7eb;
          ">
            <h2>تعذر تحميل مكتبة Supabase</h2>
            <p>
              تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.
            </p>
          </div>
        </div>
      `;
      throw new Error("Supabase JS library was not loaded.");
    }


    const { createClient } = window.supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    /* =====================================================
       STATE
       ===================================================== */

    let currentUser = null;
    let currentProfile = null;

    let teacherClasses = [];
    let teacherExams = [];

    let currentStudentExam = null;

    let questionCounter = 0;


    /* =====================================================
       DOM
       ===================================================== */

    const loginPage =
      document.getElementById("loginPage");

    const app =
      document.getElementById("app");

    const loginForm =
      document.getElementById("loginForm");

    const loginMessage =
      document.getElementById("loginMessage");

    const globalMessage =
      document.getElementById("globalMessage");

    const teacherDashboard =
      document.getElementById("teacherDashboard");

    const studentDashboard =
      document.getElementById("studentDashboard");

    const studentExamPage =
      document.getElementById("studentExamPage");

    const questionsContainer =
      document.getElementById("questionsContainer");

    const examClass =
      document.getElementById("examClass");

    const teacherExamsContainer =
      document.getElementById("teacherExams");

    const studentExamsContainer =
      document.getElementById("studentExams");


    /* =====================================================
       HELPERS
       ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function showMessage(
      container,
      message,
      type = "info"
    ) {

      if (!container) return;

      const safeMessage =
        escapeHTML(message);

      container.innerHTML = `
        <div class="alert alert-${type}">
          ${safeMessage}
        </div>
      `;
    }


    function clearMessage(container) {

      if (container) {
        container.innerHTML = "";
      }
    }


    function showLogin() {

      loginPage.classList.remove("hidden");

      app.classList.add("hidden");

      teacherDashboard.classList.add("hidden");

      studentDashboard.classList.add("hidden");

      studentExamPage.classList.add("hidden");
    }


    function showApp() {

      loginPage.classList.add("hidden");

      app.classList.remove("hidden");
    }


    function formatDate(date) {

      if (!date) {
        return "غير محدد";
      }

      try {

        return new Date(date).toLocaleString(
          "ar-SA",
          {
            dateStyle: "medium",
            timeStyle: "short"
          }
        );

      } catch {

        return String(date);
      }
    }


    function parseAnswerKey(value) {

      if (!value) {

        return {
          questions: []
        };
      }


      if (typeof value === "string") {

        try {
          return JSON.parse(value);
        } catch {
          return {
            questions: []
          };
        }
      }


      return value;
    }


    function normalizeRole(role) {

      return String(role || "")
        .trim()
        .toLowerCase();
    }


    /* =====================================================
       AUTH
       ===================================================== */

    async function login(email, password) {

      clearMessage(loginMessage);

      const button =
        document.getElementById("loginButton");

      button.disabled = true;
      button.textContent = "جارٍ الدخول...";


      try {

        const {
          data,
          error
        } = await db.auth.signInWithPassword({
          email,
          password
        });


        if (error) {
          throw error;
        }


        if (!data || !data.user) {
          throw new Error(
            "تمت محاولة تسجيل الدخول ولكن لم يتم إرجاع المستخدم."
          );
        }


        currentUser = data.user;

        await loadUser();


      } catch (error) {

        console.error("LOGIN ERROR:", error);

        showMessage(
          loginMessage,
          getErrorMessage(error),
          "error"
        );

      } finally {

        button.disabled = false;

        button.textContent = "دخول";
      }
    }


    function getErrorMessage(error) {

      const message =
        error?.message ||
        error?.error_description ||
        "حدث خطأ غير معروف.";

      const lower =
        String(message).toLowerCase();


      if (
        lower.includes("invalid login credentials")
      ) {

        return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
      }


      if (
        lower.includes("email not confirmed")
      ) {

        return "البريد الإلكتروني للحساب غير مؤكد في Supabase.";
      }


      if (
        lower.includes("fetch")
        ||
        lower.includes("network")
      ) {

        return "تعذر الاتصال بـ Supabase. تحقق من الإنترنت وإعدادات المشروع.";
      }


      return String(message);
    }


    async function logout() {

      try {
        await db.auth.signOut();
      } catch (error) {
        console.error("LOGOUT ERROR:", error);
      }

      currentUser = null;
      currentProfile = null;

      showLogin();
    }


    /* =====================================================
       LOAD USER
       ===================================================== */

    async function loadUser() {

      if (!currentUser) {

        showLogin();
        return;
      }


      clearMessage(loginMessage);
      clearMessage(globalMessage);


      const {
        data,
        error
      } = await db
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .maybeSingle();


      if (error) {

        console.error("PROFILE ERROR:", error);

        showMessage(
          loginMessage,
          "تم تسجيل الدخول، ولكن تعذر قراءة ملف المستخدم من جدول profiles. " +
          error.message,
          "error"
        );

        return;
      }


      if (!data) {

        showMessage(
          loginMessage,
          "تم تسجيل الدخول، لكن لا يوجد سجل لهذا المستخدم في جدول profiles.",
          "error"
        );

        return;
      }


      currentProfile = data;


      document.getElementById("userEmail").textContent =
        currentUser.email || data.email || "";


      document.getElementById("userRole").textContent =
        data.role || "غير محدد";


      showApp();


      const role =
        normalizeRole(data.role);


      if (role === "teacher") {

        await loadTeacherDashboard();

      } else if (role === "student") {

        await loadStudentDashboard();

      } else {

        showMessage(
          globalMessage,
          "دور المستخدم غير معروف: " + (data.role || "فارغ"),
          "error"
        );
      }
    }


    /* =====================================================
       TEACHER DASHBOARD
       ===================================================== */

    async function loadTeacherDashboard() {

      teacherDashboard.classList.remove("hidden");

      studentDashboard.classList.add("hidden");

      studentExamPage.classList.add("hidden");


      await loadTeacherClasses();

    function removeQuestion(card) {

      if (!card) return;

      card.remove();

      renumberQuestions();
    }


    function renumberQuestions() {

      const cards =
        document.querySelectorAll(
          ".question-card"
        );


      cards.forEach((card, index) => {

        const number =
          index + 1;


        card.dataset.questionNumber =
          String(number);


        const title =
          card.querySelector(
            ".question-number"
          );


        if (title) {

          title.textContent =
            "السؤال " + number;
        }


        const radios =
          card.querySelectorAll(
            'input[type="radio"]'
          );


        radios.forEach(radio => {

          radio.name =
            "correct-" + number;
        });
      });


      questionCounter =
        cards.length;
    }


    /* =====================================================
       COLLECT QUESTIONS
       ===================================================== */

    function collectQuestions() {

      const cards =
        document.querySelectorAll(
          ".question-card"
        );


      if (!cards.length) {

        throw new Error(
          "أضف سؤالًا واحدًا على الأقل."
        );
      }


      const questions = [];


      cards.forEach((card, index) => {

        const text =
          card.querySelector(
            ".question-text"
          ).value.trim();


        const scoreValue =
          Number(
            card.querySelector(
              ".question-score"
            ).value
          );


        const options =
          Array.from(
            card.querySelectorAll(
              ".option-input"
            )
          ).map(
            input => input.value.trim()
          );


        const correctRadio =
          card.querySelector(
            'input[type="radio"]:checked'
          );


        if (!text) {

          throw new Error(
            "اكتب نص السؤال رقم " +
            (index + 1) +
            "."
          );
        }


        if (
          options.some(
            option => !option
          )
        ) {

          throw new Error(
            "أكمل جميع خيارات السؤال رقم " +
            (index + 1) +
            "."
          );
        }


        if (!correctRadio) {

          throw new Error(
            "حدد الإجابة الصحيحة للسؤال رقم " +
            (index + 1) +
            "."
          );
        }


        questions.push({

          id:
            crypto.randomUUID(),

          text,

          options,

          correctIndex:
            Number(correctRadio.value),

          score:
            Number.isFinite(scoreValue) &&
            scoreValue > 0
              ? scoreValue
              : 1

        });
      });


      return questions;
    }


    /* =====================================================
       CREATE EXAM
       ===================================================== */

    async function createExam() {

      clearMessage(globalMessage);


      const createButton =
        document.getElementById(
          "createExamButton"
        );


      try {

        if (
          !currentUser ||
          !currentProfile ||
          normalizeRole(currentProfile.role) !== "teacher"
        ) {

          throw new Error(
            "يجب تسجيل الدخول كمعلم."
          );
        }


        const title =
          document.getElementById(
            "examTitle"
          ).value.trim();


        const classId =
          examClass.value;


        const duration =
          Number(
            document.getElementById(
              "examDuration"
            ).value
          );


        const startValue =
          document.getElementById(
            "examStart"
          ).value;


        const endValue =
          document.getElementById(
            "examEnd"
          ).value;


        if (!title) {

          throw new Error(
            "اكتب عنوان الاختبار."
          );
        }


        if (!classId) {

          throw new Error(
            "اختر الفصل."
          );
        }


        const selectedClass =
          teacherClasses.find(
            c => String(c.id) === String(classId)
          );


        if (!selectedClass) {

          throw new Error(
            "الفصل المحدد غير موجود."
          );
        }


        if (
          startValue &&
          endValue &&
          new Date(startValue).getTime() >=
          new Date(endValue).getTime()
        ) {

          throw new Error(
            "وقت نهاية الاختبار يجب أن يكون بعد وقت البداية."
          );
        }


        const questions =
          collectQuestions();


        const totalScore =
          questions.reduce(
            (sum, question) =>
              sum + Number(question.score || 0),
            0
          );


        const examId =
          crypto.randomUUID();


        createButton.disabled = true;

        createButton.textContent =
          "جارٍ الحفظ...";


        const examData = {

          id:
            examId,

          school_id:
            selectedClass.school_id ?? null,

          class_id:
            selectedClass.id,

          subject_id:
            null,

          teacher_id:
            currentUser.id,

          title,

          total_score:
            totalScore,

          duration_minutes:
            duration > 0
              ? duration
              : null,

          starts_at:
            startValue
              ? new Date(startValue).toISOString()
              : null,

          ends_at:
            endValue
              ? new Date(endValue).toISOString()
              : null

        };


        const {
          error: examError
        } = await db
          .from("exams")
          .insert(examData);


        if (examError) {

          throw examError;
        }


        const answerKey = {

          version: 1,

          questions

        };


        const {
          error: answerError
        } = await db
          .from("exam_answer_keys")
          .insert({

            exam_id:
              examId,

            answer_key:
              answerKey

          });


        if (answerError) {

          await db
            .from("exams")
            .delete()
            .eq("id", examId);


          throw answerError;
        }


        showMessage(
          globalMessage,
          "تم إنشاء الاختبار ونشره بنجاح.",
          "success"
        );


        resetExamBuilder();

        await loadTeacherExams();


      } catch (error) {

        console.error(
          "CREATE EXAM ERROR:",
          error
        );


        showMessage(
          globalMessage,
          getErrorMessage(error),
          "error"
        );

      } finally {

        createButton.disabled = false;

        createButton.textContent =
          "حفظ ونشر الاختبار";
      }
    }

        });

        );

          examError.message,

        );

      }

        );
      }

            }

    /* =====================================================
       SUBMIT STUDENT EXAM
       ===================================================== */

    function submitStudentExam() {

      if (!currentStudentExam) {
        return;
      }


      const {
        exam,
        questions
      } = currentStudentExam;


      let score = 0;

      let answered = 0;


      questions.forEach(
        (question, index) => {

          const selected =
            document.querySelector(
              `input[name="answer-${index}"]:checked`
            );


          if (!selected) {
            return;
          }


          answered++;


          const selectedIndex =
            Number(selected.value);


          if (
            selectedIndex ===
            Number(question.correctIndex)
          ) {

            score +=
              Number(question.score || 1);
          }
        }
      );


      const total =
        Number(exam.total_score || 0);


      const percentage =
        total > 0
          ? Math.round(
              (score / total) * 100
            )
          : 0;


      const result =
        document.getElementById(
          "studentResult"
        );


      result.classList.remove("hidden");


      result.innerHTML = `

        <div class="card">

          <div class="result-box">

            <h2>
              تم تسليم الاختبار
            </h2>

            <div class="result-score">
              ${score} / ${total}
            </div>

            <p>
              النسبة:
              <strong>
                ${percentage}%
              </strong>
            </p>

            <p>
              عدد الأسئلة المجاب عنها:
              ${answered}
              من
              ${questions.length}
            </p>

          </div>

          <button
            class="btn btn-primary"
            type="button"
            id="returnToStudentExams"
          >
            العودة إلى الاختبارات
          </button>

        </div>
      `;


      document
        .getElementById("returnToStudentExams")
        .addEventListener(
          "click",
          loadStudentDashboard
        );


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    /* =====================================================
       EVENTS
       ===================================================== */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const email =
          document.getElementById(
            "loginEmail"
          ).value.trim();


        const password =
          document.getElementById(
            "loginPassword"
          ).value;


        if (!email || !password) {

          showMessage(
            loginMessage,
            "أدخل البريد الإلكتروني وكلمة المرور.",
            "error"
          );

          return;
        }


        await login(
          email,
          password
        );
      }
    );


    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        logout
      );


    document
      .getElementById("addQuestionButton")
      .addEventListener(
        "click",
        addQuestion
      );


    document
      .getElementById("createExamButton")
      .addEventListener(
        "click",
        createExam
      );


    document
      .getElementById("submitStudentExam")
      .addEventListener(
        "click",
        submitStudentExam
      );


    document
      .getElementById("backToStudentExams")
      .addEventListener(
        "click",
        loadStudentDashboard
      );


    /* =====================================================
       TEACHER EXAM EVENTS
       ===================================================== */

    teacherExamsContainer.addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest("button");


        if (!button) {
          return;
        }


        const action =
          button.dataset.action;


        const id =
          button.dataset.id;


        if (!id) {
          return;
        }


        if (action === "view-exam") {

          await viewExamQuestions(id);
        }


        if (action === "delete-exam") {

          await deleteExam(id);
        }
      }
    );


    /* =====================================================
       STUDENT EXAM EVENTS
       ===================================================== */

    studentExamsContainer.addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest(
            ".start-student-exam"
          );


        if (!button) {
          return;
        }


        const id =
          button.dataset.id;


        if (!id) {
          return;
        }


        await openStudentExam(id);
      }
    );


    /* =====================================================
       AUTH STATE
       ===================================================== */

    db.auth.onAuthStateChange(
      (event, session) => {

        if (event === "SIGNED_OUT") {

          currentUser = null;

          currentProfile = null;

          showLogin();

          return;
        }


        if (
          session &&
          !currentUser
        ) {

          currentUser =
            session.user;

          setTimeout(
            () => {
              loadUser().catch(
                console.error
              );
            },
            0
          );
        }
      }
    );


    /* =====================================================
       INITIALIZE
       ===================================================== */

    async function initialize() {

      try {

        showLogin();


        const {
          data,
          error
        } =
          await db.auth.getSession();


        if (error) {

          console.error(
            "SESSION ERROR:",
            error
          );

          showMessage(
            loginMessage,
            "تعذر قراءة جلسة تسجيل الدخول: " +
            error.message,
            "error"
          );

          return;
        }


        if (data?.session?.user) {

          currentUser =
            data.session.user;

          await loadUser();

        } else {

          showLogin();
        }


      } catch (error) {

        console.error(
          "INITIALIZE ERROR:",
          error
        );


        showMessage(
          loginMessage,
          "حدث خطأ أثناء تشغيل الموقع: " +
          getErrorMessage(error),
          "error"
        );


        showLogin();
      }
    }


    initialize();

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>معين — الاختبارات</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;

      --bg: #f4f6fa;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --border: #e5e7eb;
      --soft: #eef4ff;

      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-inner {
      max-width: 1150px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .role-badge {
      padding: 7px 12px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-weight: 700;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: min(1150px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: min(500px, 100%);
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .06);
    }

    .login-title {
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 10px;
    }

    .login-subtitle {
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* =========================
       CARDS
    ========================= */

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .04);
      margin-bottom: 20px;
    }

    .page-title {
      font-size: 30px;
      font-weight: 800;
      margin: 0 0 7px;
    }

    .page-subtitle {
      color: var(--muted);
      margin: 0 0 25px;
    }

    /* =========================
       FORMS
    ========================= */

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 13px 14px;
      outline: none;
      background: white;
      color: var(--text);
      transition: .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* =========================
       BUTTONS
    ========================= */

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      transition: .2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

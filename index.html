<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معين — الاختبارات والتصحيح</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box} body{margin:0} button,input{font:inherit}
    .top{background:#fff;border-bottom:1px solid #e7eaf0;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3}
    .brand{font-size:22px;font-weight:800}.muted{color:#667085}.wrap{max-width:1100px;margin:0 auto;padding:24px}
    .card{background:#fff;border:1px solid #e6e9ef;border-radius:16px;padding:20px;box-shadow:0 5px 20px #1822300a;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
    .btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;background:#1f5eff;color:white;font-weight:700}
    .btn.secondary{background:#eef2ff;color:#274690}.btn.danger{background:#fee4e2;color:#b42318}.btn:disabled{opacity:.5;cursor:not-allowed}
    input{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;margin:7px 0 14px}
    label{font-weight:700;font-size:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
    .badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef4ff;color:#1849a9;font-size:12px;font-weight:700}
    .badge.green{background:#ecfdf3;color:#027a48}.badge.orange{background:#fff6ed;color:#c4320a}
    .question{border:1px solid #e6e9ef;border-radius:12px;padding:14px;margin:12px 0}.answers{display:flex;gap:8px;flex-wrap:wrap}
    .answer{border:1px solid #d0d5dd;background:#fff;padding:9px 13px;border-radius:9px;cursor:pointer}
    .answer.active{background:#e0eaff;border-color:#5b8def;color:#123b8d;font-weight:800}
    table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eaecf0;text-align:right}
    .empty{padding:30px;text-align:center;color:#667085}.error{background:#fef3f2;color:#b42318;border:1px solid #fecdca;padding:10px;border-radius:10px;margin-bottom:12px}
    .success{background:#ecfdf3;color:#027a48;border:1px solid #abefc6;padding:10px;border-radius:10px;margin-bottom:12px}
    .hidden{display:none!important}.small{font-size:13px}
  </style>
</head>
<body>
<header class="top">
  <div class="brand">معين</div>
  <div class="row">
    <span id="userLabel" class="muted small"></span>
    <button id="logoutBtn" class="btn secondary hidden">تسجيل الخروج</button>
  </div>
</header>

<main class="wrap">
  <section id="setup" class="card">
    <h2>إعداد الاتصال بـ Supabase</h2>
    <p class="muted">ضع رابط مشروع Supabase ومفتاح anon/public. لا تضع service_role هنا.</p>
    <label>Supabase URL</label>
    <input id="sbUrl" placeholder="https://xxxxx.supabase.co">
    <label>Anon / Publishable Key</label>
    <input id="sbKey" type="password" placeholder="eyJ...">
    <button id="connectBtn" class="btn">اتصال وتشغيل معين</button>
    <p class="muted small">يتم حفظ القيم محليًا في هذا المتصفح فقط.</p>
  </section>

  <section id="login" class="card hidden">
    <h2>تسجيل الدخول</h2>
    <div id="loginMsg"></div>
    <label>البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username">
    <label>كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn" class="btn">دخول</button>
  </section>

  <section id="app" class="hidden">
    <div id="appMsg"></div>
    <div id="studentView" class="hidden"></div>
    <div id="teacherView" class="hidden"></div>
  </section>
</main>

<script>
let supabase = null;
let currentUser = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const msg = (text, ok=false) => `<div class="${ok?'success':'error'}">${esc(text)}</div>`;

function show(id, yes=true){ $(id).classList.toggle('hidden', !yes); }

async function connect(){
  const url=$('sbUrl').value.trim(), key=$('sbKey').value.trim();
  if(!url||!key) return $('loginMsg').innerHTML=msg('أدخل بيانات Supabase أولًا.');
  localStorage.setItem('maeen_sb_url',url); localStorage.setItem('maeen_sb_key',key);
  supabase=window.supabase.createClient(url,key);
  show('setup',false); show('login',true);
  const {data:{session}}=await supabase.auth.getSession();
  if(session) await startApp(session.user); 
}
async function startApp(user){
  currentUser=user; show('login',false); show('app',true); show('logoutBtn',true);
  $('userLabel').textContent=user.email||'';
  const {data:profile,error}=await supabase.from('profiles').select('id,full_name,role').eq('id',user.id).single();
  if(error) return $('appMsg').innerHTML=msg('تعذر قراءة ملف المستخدم: '+error.message);
  $('userLabel').textContent=`${profile.full_name} — ${profile.role}`;
  if(profile.role==='teacher' || profile.role==='admin') return loadTeacher();
  if(profile.role==='student') return loadStudent();
  $('appMsg').innerHTML=msg('الدور الحالي غير مدعوم في هذه النسخة.');
}

async function loadStudent(){
  show('teacherView',false); show('studentView',true);
  $('studentView').innerHTML=`<div class="card"><h2>اختبارات الطالب</h2><div id="studentContent">جارٍ التحميل...</div></div>`;
  const {data:classes,error:ce}=await supabase.from('class_students').select('class_id').eq('student_id',currentUser.id);
  if(ce) return $('studentContent').innerHTML=msg(ce.message);
  const ids=(classes||[]).map(x=>x.class_id);
  if(!ids.length) return $('studentContent').innerHTML=`<div class="empty">لا توجد صفوف مسجل بها الطالب.</div>`;
  const {data:exams,error}=await supabase.from('exams').select('id,title,total_score,duration_minutes,starts_at,ends_at,class_id,teacher_id').in('class_id',ids).order('starts_at',{ascending:true});
  if(error) return $('studentContent').innerHTML=msg(error.message);
  const {data:results}=await supabase.from('exam_results').select('id,exam_id,score,status,created_at').eq('student_id',currentUser.id);
  const rmap=new Map((results||[]).map(r=>[r.exam_id,r]));
  $('studentContent').innerHTML=(exams||[]).map(e=>{
    const r=rmap.get(e.id);
    return `<div class="card">
      <div class="row"><h3>${esc(e.title)}</h3><span class="spacer"></span>
      ${r?`<span class="badge green">${esc(r.status)} — ${r.score==null?'بدون درجة':r.score+'/'+(e.total_score??'')}</span>`:`<span class="badge">غير مسلّم</span>`}</div>
      <p class="muted small">البداية: ${esc(e.starts_at||'—')} | النهاية: ${esc(e.ends_at||'—')}</p>
      ${r?`<button class="btn secondary" onclick="viewStudentResult('${e.id}')">عرض النتيجة</button>`:`<button class="btn" onclick="takeExam('${e.id}')">بدء الاختبار</button>`}
    </div>`;
  }).join('') || `<div class="empty">لا توجد اختبارات.</div>`;
}

async function takeExam(examId){
  const {data:e,error}=await supabase.from('exams').select('id,title,total_score,starts_at,ends_at').eq('id',examId).single();
  if(error) return $('studentView').innerHTML=msg(error.message);
  // The answer key is intentionally never requested here; RLS protects it.
  $('studentView').innerHTML=`<div class="card"><div class="row"><button class="btn secondary" onclick="loadStudent()">رجوع</button><span class="spacer"></span><h2>${esc(e.title)}</h2></div>
  <p class="muted">أدخل الإجابات ثم اضغط تسليم. التصحيح يتم تلقائيًا إذا كان مفتاح الإجابة متاحًا.</p>
  <div id="examQuestions">
    ${['q1','q2','q3'].map((q,i)=>`<div class="question"><b>السؤال ${i+1} (${q})</b><div class="answers" data-q="${q}">
      ${['A','B','C','D'].map(a=>`<button class="answer" onclick="pickAnswer(this,'${q}','${a}')">${a}</button>`).join('')}
    </div></div>`).join('')}
  </div>
  <button class="btn" onclick="submitCurrentExam('${e.id}')">تسليم الاختبار</button>
  </div>`;
}
function pickAnswer(btn,q,a){
  document.querySelectorAll(`[data-q="${q}"] .answer`).forEach(x=>x.classList.remove('active')); btn.classList.add('active');
}
async function submitCurrentExam(examId){
  const answers={};
  document.querySelectorAll('.answers').forEach(box=>{const b=box.querySelector('.answer.active'); if(b) answers[box.dataset.q]=b.textContent;});
  const {data,error}=await supabase.rpc('submit_exam',{p_exam_id:examId,p_answers:answers});
  if(error) return alert(error.message);
  await loadStudent();
  alert('تم تسليم الاختبار بنجاح.');
}
async function viewStudentResult(examId){
  const {data:r}=await supabase.from('exam_results').select('score,status,automatic_score,created_at').eq('exam_id',examId).eq('student_id',currentUser.id).single();
  const {data:e}=await supabase.from('exams').select('title,total_score').eq('id',examId).single();
  if(!r||!e) return;
  $('studentView').innerHTML=`<div class="card"><button class="btn secondary" onclick="loadStudent()">رجوع</button><h2>${esc(e.title)}</h2><div class="card"><h1>${esc(r.score??'—')} / ${esc(e.total_score??'—')}</h1><span class="badge green">${esc(r.status)}</span><p class="muted">تصحيح تلقائي: ${r.automatic_score?'نعم':'لا'}</p></div></div>`;
}

async function loadTeacher(){
  show('studentView',false); show('teacherView',true);
  $('teacherView').innerHTML=`<div class="card"><h2>لوحة المعلم</h2><div id="teacherContent">جارٍ التحميل...</div></div>`;
  const {data:exams,error}=await supabase.from('exams').select('id,title,total_score,class_id,starts_at,ends_at').eq('teacher_id',currentUser.id).order('created_at',{ascending:false});
  if(error) return $('teacherContent').innerHTML=msg(error.message);
  $('teacherContent').innerHTML=(exams||[]).map(e=>`<div class="card"><div class="row"><h3>${esc(e.title)}</h3><span class="spacer"></span><span class="badge">${esc(e.total_score??'')}</span></div><p class="muted small">البداية: ${esc(e.starts_at||'—')} | النهاية: ${esc(e.ends_at||'—')}</p><button class="btn" onclick="teacherResults('${e.id}')">النتائج والتصحيح</button></div>`).join('')||`<div class="empty">لا توجد اختبارات لهذا المعلم.</div>`;
}
async function teacherResults(examId){
  const {data:e,error:ee}=await supabase.from('exams').select('id,title,total_score').eq('id',examId).single();
  if(ee) return $('teacherView').innerHTML=msg(ee.message);
  const {data:rs,error}=await supabase.from('exam_results').select('id,student_id,answers,score,automatic_score,status,created_at').eq('exam_id',examId).order('created_at',{ascending:false});
  if(error) return $('teacherView').innerHTML=msg(error.message);
  const ids=(rs||[]).map(r=>r.student_id);
  let profiles=[];
  if(ids.length){const p=await supabase.from('profiles').select('id,full_name').in('id',ids); profiles=p.data||[];}
  const names=new Map(profiles.map(p=>[p.id,p.full_name]));
  $('teacherView').innerHTML=`<div class="card"><div class="row"><button class="btn secondary" onclick="loadTeacher()">رجوع</button><span class="spacer"></span><h2>${esc(e.title)} — النتائج</h2></div>
  <div class="card"><table><thead><tr><th>الطالب</th><th>الدرجة</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>
  ${(rs||[]).map(r=>`<tr><td>${esc(names.get(r.student_id)||r.student_id)}</td><td>${esc(r.score??'—')} / ${esc(e.total_score??'')}</td><td>${esc(r.status)}</td><td><button class="btn" onclick="editGrade('${r.id}','${esc(names.get(r.student_id)||'الطالب')}','${r.score??''}','${e.total_score??''}')">تصحيح</button></td></tr>`).join('')||`<tr><td colspan="4" class="empty">لا توجد نتائج بعد.</td></tr>`}
  </tbody></table></div></div>`;
}
async function editGrade(resultId,student,current,total){
  const value=prompt(`الدرجة الجديدة للطالب ${student} (من ${total}):`,current);
  if(value===null) return;
  const score=Number(value);
  if(!Number.isFinite(score)||score<0||score>Number(total)) return alert('درجة غير صالحة.');
  const {error}=await supabase.from('exam_results').update({score,status:'graded'}).eq('id',resultId);
  if(error) return alert(error.message);
  alert('تم حفظ الدرجة.');
  // Re-read from database; this also verifies the RLS UPDATE/SELECT path.
  const row=await supabase.from('exam_results').select('score,status').eq('id',resultId).single();
  if(row.error) return alert(row.error.message);
  await teacherResults((await supabase.from('exam_results').select('exam_id').eq('id',resultId).single()).data.exam_id);
}

$('connectBtn').onclick=connect;
$('loginBtn').onclick=async()=>{
  $('loginMsg').innerHTML='';
  const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  if(error) return $('loginMsg').innerHTML=msg(error.message);
  await startApp(data.user);
};
$('logoutBtn').onclick=async()=>{await supabase.auth.signOut(); location.reload();};

window.addEventListener('load',async()=>{
  const u=localStorage.getItem('maeen_sb_url'), k=localStorage.getItem('maeen_sb_key');
  if(u&&k){$('sbUrl').value=u;$('sbKey').value=k; supabase=window.supabase.createClient(u,k); show('setup',false); const {data:{session}}=await supabase.auth.getSession(); if(session) await startApp(session.user); else show('login',true);}
});
</script>
</body>
</html>
